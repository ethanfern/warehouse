<title>Belt Numbers List</title>
<style>
/* Layout: one narrow column built for one hand on a phone. Result card on top, scan button docked at the bottom of the screen. */
:root {
  --bg: #EDEFEA;
  --surface: #FFFFFF;
  --ink: #151918;
  --muted: #58625D;
  --line: #C9D0CA;
  --accent: #F0B400;
  --accent-ink: #151918;
  --yours: #157A3B;
  --yours-ink: #FFFFFF;
  --pass: #2B3330;
  --pass-ink: #EDEFEA;
  --warn: #8F2514;
  --warn-bg: #FBE9E4;
  --focus: #0B57D0;
  --font-display: 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101312;
    --surface: #1A1F1D;
    --ink: #EEF1ED;
    --muted: #9BA6A0;
    --line: #303835;
    --accent: #FFC61A;
    --accent-ink: #151918;
    --yours: #2FD17A;
    --yours-ink: #06210F;
    --pass: #2A322F;
    --pass-ink: #EEF1ED;
    --warn: #FFB4A5;
    --warn-bg: #3A1F1A;
    --focus: #8AB4FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101312;
  --surface: #1A1F1D;
  --ink: #EEF1ED;
  --muted: #9BA6A0;
  --line: #303835;
  --accent: #FFC61A;
  --accent-ink: #151918;
  --yours: #2FD17A;
  --yours-ink: #06210F;
  --pass: #2A322F;
  --pass-ink: #EEF1ED;
  --warn: #FFB4A5;
  --warn-bg: #3A1F1A;
  --focus: #8AB4FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.4;
  padding-block: 16px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 36px;
  text-transform: uppercase; letter-spacing: .03em; line-height: 1;
}
.hazard {
  width: 84px; height: 8px; margin: 8px 0 8px;
  background: repeating-linear-gradient(135deg, var(--accent) 0 8px, var(--ink) 8px 16px);
}
.sub { margin: 0; color: var(--muted); font-size: 15px; }

.label {
  font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.mine { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 16px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1;
}
.chip button {
  width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  font-size: 24px; line-height: 1; color: var(--muted);
}
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.field {
  height: 52px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px;
  background: var(--surface); font-size: 18px; width: 100%;
}
.btn {
  height: 52px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface);
  font-weight: 600; cursor: pointer;
}
.btn.small { height: 40px; padding: 0 12px; font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.suburb { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; }
.pc { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag {
  margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted);
}
.read { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.nums { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.num {
  display: inline-block; font-family: var(--font-display); font-weight: 700; line-height: .95;
  padding: .04em .2em .02em; border: 3px solid var(--ink); border-radius: 10px; background: var(--surface);
  font-variant-numeric: tabular-nums; font-size: clamp(72px, 24vw, 120px);
}
.nums.single .num { font-size: clamp(110px, 36vw, 176px); }
.nums.mid .num { font-size: clamp(52px, 16vw, 76px); border-width: 2px; border-radius: 8px; }
.num.yours { background: var(--yours); color: var(--yours-ink); border-color: var(--yours); }
.verdict {
  margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-family: var(--font-display);
  font-weight: 700; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em;
}
.verdict.yours { background: var(--yours); color: var(--yours-ink); }
.verdict.pass { background: var(--pass); color: var(--pass-ink); }
.meta { margin: 10px 0 0; color: var(--muted); font-size: 15px; }
.warnbox {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn);
  font-size: 15px; font-weight: 500;
}
.variants { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.variant { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.variant .vl { font-weight: 600; }
.variant .vs { color: var(--muted); font-size: 14px; }
.reading { display: flex; gap: 14px; align-items: center; }
.reading img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.reading .big { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; line-height: 1; }
.suggs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.lookup { display: flex; flex-direction: column; gap: 8px; }
.sugg-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.sugg-list:empty { display: none; }
.sugg-list li + li { border-top: 1px solid var(--line); }
.sugg-list button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 52px;
  padding: 6px 14px; border: 0; background: transparent; cursor: pointer; text-align: left;
}
.sugg-list .n { font-family: var(--font-display); font-weight: 700; font-size: 28px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.recent h2, .sheet summary {
  margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.recent ol { list-style: none; margin: 8px 0 0; padding: 0; }
.recent li button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 52px;
  padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left;
}
.recent .nn { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mini {
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; padding: 3px 8px 1px;
  border: 2px solid var(--ink); border-radius: 6px; font-variant-numeric: tabular-nums;
}
.mini.yours { background: var(--yours); color: var(--yours-ink); border-color: var(--yours); }

.sheet { border-top: 2px solid var(--ink); padding-top: 12px; }
.sheet summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.sheet .body { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.srow .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.srow .sd { color: var(--muted); font-size: 14px; font-weight: 400; }
.srow .nn { font-family: var(--font-display); font-weight: 700; font-size: 26px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.srow .edit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.srow .edit input { flex: 1; min-width: 120px; height: 44px; font-size: 18px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.badge.chk { background: var(--warn-bg); color: var(--warn); }
.badge.ed { border: 1px solid var(--line); color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.scan {
  display: flex; align-items: center; justify-content: center; gap: 12px; height: 68px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); border: 2px solid var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 32px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
}
.scan svg { width: 32px; height: 32px; }
.scan.off { opacity: .45; cursor: not-allowed; }
.scan-note { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
.scan-note:empty { display: none; }

body { padding-block: 16px 32px; }
.searchbar { position: sticky; top: 0; z-index: 4; background: var(--bg); padding-block: 8px; display: flex; flex-direction: column; gap: 6px; }
.searchbar .field { height: 60px; font-size: 22px; }
.res { display: flex; flex-direction: column; gap: 12px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.rcard .suburb { font-size: 34px; }
.rcard .nums { margin-top: 0; }
.rcard .num { font-size: 64px; }
.rcard.many .num { font-size: 48px; }
.vrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vrow .vl { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.vrow .vs { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); padding: 12px 2px; }
details.mine2 { border-top: 1px solid var(--line); padding-top: 10px; }
details.mine2 summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
details.mine2 .inner { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Van Numbers</h1>
    <div class="hazard" aria-hidden="true"></div>
    <p class="sub">Type a suburb. No camera. Nothing is saved or sent.</p>
  </header>

  <div class="searchbar">
    <label class="sr" for="q">Suburb</label>
    <div class="row">
      <input class="field" id="q" type="search" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Suburb, e.g. Salis" autofocus>
      <button class="btn" id="clear" type="button">Clear</button>
    </div>
  </div>

  <div class="res" id="res" aria-live="polite"></div>

  <details class="mine2">
    <summary id="mine-sum">Your numbers</summary>
    <div class="inner">
      <div class="chips" id="mine-chips"></div>
      <p class="hint">Add the numbers you take off the belt, like 13, 10, 55. They show green in the results.</p>
      <form class="row" id="mine-form" autocomplete="off">
        <label class="sr" for="mine-input">Add a number</label>
        <input class="field" id="mine-input" inputmode="numeric" placeholder="Add a number" maxlength="12">
        <button class="btn" type="submit">Add</button>
      </form>
    </div>
  </details>
</div>

const DATA = RAW.trim().split('\n').map((line, i) => {
  const p = line.split('|');
  return {
    i,
    nums: p[0].split(',').map(s => s.trim()),
    name: p[1].trim(),
    st: (p[2] || '').trim(),
    sd: (p[3] || '').trim(),
    chk: (p[4] || '').trim() === '!'
  };
});

const TOK = { MOUNT: 'MT', SAINT: 'ST', STH: 'SOUTH', NTH: 'NORTH', GDNS: 'GARDENS', GDN: 'GARDEN', COLONEL: 'COL', PORT: 'PT', HTS: 'HEIGHTS', PK: 'PARK', FLT: 'FLAT' };
function norm(s) {
  return String(s || '').toUpperCase().replace(/[’'`.]/g, '').replace(/&/g, ' AND ')
    .replace(/[^A-Z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map(t => TOK[t] || t).join(' ');
}
function prep(q) {
  return String(q || '').replace(/\b\d{4}\b/g, ' ').replace(/\b(SA|S\.A\.|SOUTH AUSTRALIA)\s*$/i, ' ').trim();
}
function title(s) {
  return s.toLowerCase()
    .replace(/(^|[\s\-\/'(])([a-z])/g, (m, a, b) => a + b.toUpperCase())
    .replace(/\bMc([a-z])/g, (m, c) => 'Mc' + c.toUpperCase())
    .replace(/\bRaaf\b/g, 'RAAF');
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur.push(v);
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

const IDX = new Map();
DATA.forEach(e => {
  e.key = norm(e.name);
  if (!IDX.has(e.key)) IDX.set(e.key, []);
  IDX.get(e.key).push(e);
});
const KEYS = [...IDX.keys()];
const ALLAREAS = KEYS.filter(k => k.endsWith(' ALL AREAS')).map(k => [k.slice(0, -10), k]);

function lookup(q) {
  const key = norm(prep(q));
  if (!key) return { key: '', list: [], how: 'none', sugg: [] };
  if (IDX.has(key)) return { key, list: IDX.get(key), how: 'exact', match: key };
  for (const [base, k] of ALLAREAS) {
    if (key === base || key.startsWith(base + ' ')) return { key, list: IDX.get(k), how: 'area', match: k };
  }
  const pre = KEYS.filter(k => k.startsWith(key + ' '));
  if (pre.length === 1 && key.length >= 4) return { key, list: IDX.get(pre[0]), how: 'near', match: pre[0] };
  const lim = key.length <= 5 ? 1 : key.length <= 10 ? 2 : 3;
  const scored = KEYS.map(k => [lev(key, k, lim), k]).filter(x => x[0] <= lim).sort((a, b) => a[0] - b[0]);
  if (scored.length && (scored.length === 1 || scored[0][0] < scored[1][0])) {
    return { key, list: IDX.get(scored[0][1]), how: 'near', match: scored[0][1] };
  }
  let sugg = scored.slice(0, 5).map(x => x[1]);
  if (!sugg.length) sugg = pre.slice(0, 5);
  if (!sugg.length) sugg = KEYS.filter(k => k.includes(key)).slice(0, 5);
  return { key, list: [], how: 'none', sugg };
}
function search(q) {
  const k = norm(q);
  if (!k) return [];
  const starts = [], inc = [];
  for (const key of KEYS) {
    if (key.startsWith(k)) starts.push(key);
    else if (key.includes(k)) inc.push(key);
  }
  return starts.concat(inc).slice(0, 8);
}

function roadNorm(s) {
  return ' ' + String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ')
    .replace(/\bROAD\b/g, 'RD').replace(/\bSTREET\b/g, 'ST').replace(/\bSTH\b/g, 'SOUTH')
    .replace(/\s+/g, ' ').trim() + ' ';
}
function phraseOf(e) { return roadNorm(e.st.replace(/^ex\s+/i, '').replace(/\bonly\b/i, '')); }
function streetHas(street, p) { return !!p.trim() && roadNorm(street).includes(p); }
const isE = e => /^ex\b/i.test(e.st);
const isO = e => !!e.st && !isE(e);
const isN = e => !e.st;
function resolveVariants(list, street) {
  if (list.length <= 1) return { groups: list, decided: true };
  if (!street) return { groups: list, decided: false };
  const O = list.filter(isO), E = list.filter(isE), N = list.filter(isN);
  const hit = e => streetHas(street, phraseOf(e));
  const oh = O.filter(hit);
  if (oh.length) return { groups: oh, decided: true };
  if (E.length) {
    if (E.some(hit)) return N.length ? { groups: N, decided: true } : { groups: list, decided: false };
    return { groups: E, decided: true };
  }
  if (N.length && O.length) return { groups: N, decided: true };
  return { groups: list, decided: false };
}

(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return el;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  let mine = (store.get('belt.mine', []) || []).filter(x => /^\d{1,2}$/.test(String(x))).map(String);
  const isMine = n => mine.includes(String(n));

  function rank(q) {
    const k = norm(q);
    if (!k) return [];
    const a = [], b = [], c = [];
    for (const key of KEYS) {
      if (key.startsWith(k)) a.push(key);
      else if (key.split(' ').some(w => w.startsWith(k.split(' ')[0])) && key.includes(k.split(' ').slice(-1)[0])) b.push(key);
      else if (key.includes(k)) c.push(key);
    }
    let out = a.concat(b, c);
    if (!out.length) {
      const r = lookup(q);
      if (r.list.length) out = [norm(r.list[0].name)];
      else out = r.sugg || [];
    }
    return out.slice(0, 12);
  }
  function tiles(nums, cls) { return h('div', { class: 'nums ' + (cls || '') }, nums.map(n => h('span', { class: 'num' + (isMine(n) ? ' yours' : ''), text: n }))); }
  function card(key) {
    const list = IDX.get(key);
    const all = [];
    list.forEach(e => e.nums.forEach(n => { if (!all.includes(n)) all.push(n); }));
    const mineHit = all.filter(isMine);
    const split = list.length > 1 && list.some(e => e.st);
    const kids = [h('div', { class: 'who' }, h('div', { class: 'suburb', text: title(list[0].name) }),
      mine.length ? (mineHit.length ? h('span', { class: 'tag', text: 'Yours' }) : null) : null)];
    if (!split && list.length === 1) {
      kids.push(tiles(list[0].nums));
      if (list[0].sd) kids.push(h('p', { class: 'meta', text: list[0].sd }));
    } else if (!split) {
      list.forEach(e => kids.push(h('div', { class: 'vrow' }, tiles(e.nums, 'mid'), e.sd ? h('span', { class: 'vs', text: e.sd }) : null)));
    } else {
      list.forEach(e => kids.push(h('div', { class: 'vrow' },
        tiles(e.nums, 'mid'),
        h('div', null, h('div', { class: 'vl', text: e.st ? (/^ex\b/i.test(e.st) ? 'Not ' + e.st.replace(/^ex\s+/i, '') : e.st + ' only') : 'Other streets' }),
          e.sd ? h('div', { class: 'vs', text: e.sd }) : null))));
    }
    if (list.some(e => e.chk)) kids.push(h('p', { class: 'warnbox', text: 'This row was hard to read from the photo of the sheet. Check the paper sheet.' }));
    return h('div', { class: 'rcard' + (split || list.length > 1 ? ' many' : '') }, kids);
  }
  const q = $('q'), res = $('res');
  function render() {
    const v = q.value.trim();
    if (!v) { res.replaceChildren(h('p', { class: 'empty', text: 'Type the first few letters of the suburb.' })); return; }
    const keys = rank(v);
    res.replaceChildren(...(keys.length ? keys.map(card) : [h('p', { class: 'empty', text: 'No suburb found. Check the spelling.' })]));
  }
  q.addEventListener('input', render);
  $('clear').addEventListener('click', () => { q.value = ''; render(); q.focus(); });

  function renderMine() {
    $('mine-chips').replaceChildren(...mine.map(n => h('span', { class: 'chip' }, n,
      h('button', { type: 'button', 'aria-label': 'Remove ' + n, onclick: () => { mine = mine.filter(x => x !== n); store.set('belt.mine', mine); renderMine(); render(); } }, '×'))));
    $('mine-sum').textContent = 'Your numbers' + (mine.length ? ': ' + mine.join(', ') : '');
  }
  $('mine-form').addEventListener('submit', ev => {
    ev.preventDefault();
    for (const n of ($('mine-input').value.match(/\d{1,2}/g) || []).map(s => String(parseInt(s, 10)))) if (!mine.includes(n) && mine.length < 12) mine.push(n);
    $('mine-input').value = ''; store.set('belt.mine', mine); renderMine(); render();
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* offline cache unavailable */ } }
  renderMine(); render();
})();
