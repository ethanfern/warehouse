<style>
/* Layout: one narrow column built for one hand on a phone. Result card on top, scan button docked at the bottom of the screen. */
:root {
  --bg: #EDEFEA;
  --surface: #FFFFFF;
  --ink: #151918;
  --muted: #58625D;
  --line: #C9D0CA;
  --accent: #F0B400;
  --accent-ink: #151918;
  --yours: #157A3B;
  --yours-ink: #FFFFFF;
  --pass: #2B3330;
  --pass-ink: #EDEFEA;
  --warn: #8F2514;
  --warn-bg: #FBE9E4;
  --focus: #0B57D0;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101312;
    --surface: #1A1F1D;
    --ink: #EEF1ED;
    --muted: #9BA6A0;
    --line: #303835;
    --accent: #FFC61A;
    --accent-ink: #151918;
    --yours: #2FD17A;
    --yours-ink: #06210F;
    --pass: #2A322F;
    --pass-ink: #EEF1ED;
    --warn: #FFB4A5;
    --warn-bg: #3A1F1A;
    --focus: #8AB4FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101312;
  --surface: #1A1F1D;
  --ink: #EEF1ED;
  --muted: #9BA6A0;
  --line: #303835;
  --accent: #FFC61A;
  --accent-ink: #151918;
  --yours: #2FD17A;
  --yours-ink: #06210F;
  --pass: #2A322F;
  --pass-ink: #EEF1ED;
  --warn: #FFB4A5;
  --warn-bg: #3A1F1A;
  --focus: #8AB4FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.4;
  padding-block: 16px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 36px;
  text-transform: uppercase; letter-spacing: .03em; line-height: 1;
}
.hazard {
  width: 84px; height: 8px; margin: 8px 0 8px;
  background: repeating-linear-gradient(135deg, var(--accent) 0 8px, var(--ink) 8px 16px);
}
.sub { margin: 0; color: var(--muted); font-size: 15px; }

.label {
  font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.mine { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 16px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1;
}
.chip button {
  width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  font-size: 24px; line-height: 1; color: var(--muted);
}
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.field {
  height: 52px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px;
  background: var(--surface); font-size: 18px; width: 100%;
}
.btn {
  height: 52px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface);
  font-weight: 600; cursor: pointer;
}
.btn.small { height: 40px; padding: 0 12px; font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.suburb { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; }
.pc { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag {
  margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted);
}
.read { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.nums { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.num {
  display: inline-block; font-family: var(--font-display); font-weight: 700; line-height: .95;
  padding: .04em .2em .02em; border: 3px solid var(--ink); border-radius: 10px; background: var(--surface);
  font-variant-numeric: tabular-nums; font-size: clamp(72px, 24vw, 120px);
}
.nums.single .num { font-size: clamp(110px, 36vw, 176px); }
.nums.mid .num { font-size: clamp(52px, 16vw, 76px); border-width: 2px; border-radius: 8px; }
.num.yours { background: var(--yours); color: var(--yours-ink); border-color: var(--yours); }
.verdict {
  margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-family: var(--font-display);
  font-weight: 700; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em;
}
.verdict.yours { background: var(--yours); color: var(--yours-ink); }
.verdict.pass { background: var(--pass); color: var(--pass-ink); }
.meta { margin: 10px 0 0; color: var(--muted); font-size: 15px; }
.warnbox {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn);
  font-size: 15px; font-weight: 500;
}
.variants { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.variant { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.variant .vl { font-weight: 600; }
.variant .vs { color: var(--muted); font-size: 14px; }
.reading { display: flex; gap: 14px; align-items: center; }
.reading img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.reading .big { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; line-height: 1; }
.suggs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.lookup { display: flex; flex-direction: column; gap: 8px; }
.sugg-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.sugg-list:empty { display: none; }
.sugg-list li + li { border-top: 1px solid var(--line); }
.sugg-list button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 52px;
  padding: 6px 14px; border: 0; background: transparent; cursor: pointer; text-align: left;
}
.sugg-list .n { font-family: var(--font-display); font-weight: 700; font-size: 28px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.recent h2, .sheet summary {
  margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.recent ol { list-style: none; margin: 8px 0 0; padding: 0; }
.recent li button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 52px;
  padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left;
}
.recent .nn { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mini {
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; padding: 3px 8px 1px;
  border: 2px solid var(--ink); border-radius: 6px; font-variant-numeric: tabular-nums;
}
.mini.yours { background: var(--yours); color: var(--yours-ink); border-color: var(--yours); }

.sheet { border-top: 2px solid var(--ink); padding-top: 12px; }
.sheet summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.sheet .body { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.srow .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.srow .sd { color: var(--muted); font-size: 14px; font-weight: 400; }
.srow .nn { font-family: var(--font-display); font-weight: 700; font-size: 26px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.srow .edit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.srow .edit input { flex: 1; min-width: 120px; height: 44px; font-size: 18px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.badge.chk { background: var(--warn-bg); color: var(--warn); }
.badge.ed { border: 1px solid var(--line); color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.scan {
  display: flex; align-items: center; justify-content: center; gap: 12px; height: 68px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); border: 2px solid var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 32px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
}
.scan svg { width: 32px; height: 32px; }
.scan.off { opacity: .45; cursor: not-allowed; }
.scan-note { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
.scan-note:empty { display: none; }

.cam { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 34vh; width: 100%; border: 2px solid var(--ink); }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
.cam .off { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfd6d1; font-family: var(--font-display); font-size: 28px; text-transform: uppercase; letter-spacing: .04em; text-align: center; padding: 16px; }
.cam.on .off { display: none; }
.camstat { margin: 6px 0 0; color: var(--muted); font-size: 14px; min-height: 20px; }
.scan.stop { background: var(--pass); color: var(--pass-ink); }
.scan:disabled { opacity: .6; }
.idle .big { font-family: var(--font-display); font-weight: 700; font-size: 34px; text-transform: uppercase; line-height: 1; }
.also { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.also .suburb { font-size: 26px; }
.also .num { font-size: 56px; }
.lab { display: flex; flex-direction: column; gap: 6px; }
.lab .nums { margin-top: 4px; }
body { padding-block: 16px 120px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Belt Numbers</h1>
    <div class="hazard" aria-hidden="true"></div>
    <p class="sub">Live camera. Point at the address and the van number shows. Nothing is uploaded or saved.</p>
  </header>

  <section>
    <div class="cam" id="cam">
      <video id="vid" playsinline muted autoplay></video>
      <div class="off">Camera is off</div>
    </div>
    <p class="camstat" id="camstat" aria-live="polite">Tap Start camera below.</p>
  </section>

  <section class="card" id="result" aria-live="polite" aria-label="Result"></section>

  <section class="mine" aria-labelledby="mine-label">
    <div class="label" id="mine-label">Numbers you take off the belt</div>
    <div class="chips" id="mine-chips"></div>
    <p class="hint" id="mine-hint">Add your numbers, like 13, 10, 55. Parcels for them show green.</p>
    <form class="row" id="mine-form" autocomplete="off">
      <label class="sr" for="mine-input">Add a number</label>
      <input class="field" id="mine-input" inputmode="numeric" placeholder="Add a number" maxlength="12">
      <button class="btn" type="submit">Add</button>
    </form>
  </section>

  <section class="lookup">
    <label class="label" for="q">Or type the suburb</label>
    <input class="field" id="q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. Salisbury">
    <ul class="sugg-list" id="sugg"></ul>
  </section>

  <section class="recent" id="recent-wrap" hidden>
    <h2>Recent</h2>
    <ol id="recent"></ol>
  </section>
</div>

<div class="dock">
  <div class="in">
    <button class="scan" id="go" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
      <span id="go-txt">Start camera</span>
    </button>
  </div>
</div>

const DATA = RAW.trim().split('\n').map((line, i) => {
  const p = line.split('|');
  return {
    i,
    nums: p[0].split(',').map(s => s.trim()),
    name: p[1].trim(),
    st: (p[2] || '').trim(),
    sd: (p[3] || '').trim(),
    chk: (p[4] || '').trim() === '!'
  };
});

const TOK = { MOUNT: 'MT', SAINT: 'ST', STH: 'SOUTH', NTH: 'NORTH', GDNS: 'GARDENS', GDN: 'GARDEN', COLONEL: 'COL', PORT: 'PT', HTS: 'HEIGHTS', PK: 'PARK', FLT: 'FLAT' };
function norm(s) {
  return String(s || '').toUpperCase().replace(/[’'`.]/g, '').replace(/&/g, ' AND ')
    .replace(/[^A-Z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map(t => TOK[t] || t).join(' ');
}
function prep(q) {
  return String(q || '').replace(/\b\d{4}\b/g, ' ').replace(/\b(SA|S\.A\.|SOUTH AUSTRALIA)\s*$/i, ' ').trim();
}
function title(s) {
  return s.toLowerCase()
    .replace(/(^|[\s\-\/'(])([a-z])/g, (m, a, b) => a + b.toUpperCase())
    .replace(/\bMc([a-z])/g, (m, c) => 'Mc' + c.toUpperCase())
    .replace(/\bRaaf\b/g, 'RAAF');
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur.push(v);
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

const IDX = new Map();
DATA.forEach(e => {
  e.key = norm(e.name);
  if (!IDX.has(e.key)) IDX.set(e.key, []);
  IDX.get(e.key).push(e);
});
const KEYS = [...IDX.keys()];
const ALLAREAS = KEYS.filter(k => k.endsWith(' ALL AREAS')).map(k => [k.slice(0, -10), k]);

function lookup(q) {
  const key = norm(prep(q));
  if (!key) return { key: '', list: [], how: 'none', sugg: [] };
  if (IDX.has(key)) return { key, list: IDX.get(key), how: 'exact', match: key };
  for (const [base, k] of ALLAREAS) {
    if (key === base || key.startsWith(base + ' ')) return { key, list: IDX.get(k), how: 'area', match: k };
  }
  const pre = KEYS.filter(k => k.startsWith(key + ' '));
  if (pre.length === 1 && key.length >= 4) return { key, list: IDX.get(pre[0]), how: 'near', match: pre[0] };
  const lim = key.length <= 5 ? 1 : key.length <= 10 ? 2 : 3;
  const scored = KEYS.map(k => [lev(key, k, lim), k]).filter(x => x[0] <= lim).sort((a, b) => a[0] - b[0]);
  if (scored.length && (scored.length === 1 || scored[0][0] < scored[1][0])) {
    return { key, list: IDX.get(scored[0][1]), how: 'near', match: scored[0][1] };
  }
  let sugg = scored.slice(0, 5).map(x => x[1]);
  if (!sugg.length) sugg = pre.slice(0, 5);
  if (!sugg.length) sugg = KEYS.filter(k => k.includes(key)).slice(0, 5);
  return { key, list: [], how: 'none', sugg };
}
function search(q) {
  const k = norm(q);
  if (!k) return [];
  const starts = [], inc = [];
  for (const key of KEYS) {
    if (key.startsWith(k)) starts.push(key);
    else if (key.includes(k)) inc.push(key);
  }
  return starts.concat(inc).slice(0, 8);
}

function roadNorm(s) {
  return ' ' + String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ')
    .replace(/\bROAD\b/g, 'RD').replace(/\bSTREET\b/g, 'ST').replace(/\bSTH\b/g, 'SOUTH').replace(/\bPT\b/g, 'PORT')
    .replace(/\s+/g, ' ').trim() + ' ';
}
function phraseOf(e) { return roadNorm(e.st.replace(/^ex\s+/i, '').replace(/\bonly\b/i, '')); }
function streetHas(street, p) { return !!p.trim() && roadNorm(street).includes(p); }
const isE = e => /^ex\b/i.test(e.st);
const isO = e => !!e.st && !isE(e);
const isN = e => !e.st;
function resolveVariants(list, street) {
  if (list.length <= 1) return { groups: list, decided: true };
  if (!street) return { groups: list, decided: false };
  const O = list.filter(isO), E = list.filter(isE), N = list.filter(isN);
  const hit = e => streetHas(street, phraseOf(e));
  const oh = O.filter(hit);
  if (oh.length) return { groups: oh, decided: true };
  if (E.length) {
    if (E.some(hit)) return N.length ? { groups: N, decided: true } : { groups: list, decided: false };
    return { groups: E, decided: true };
  }
  if (N.length && O.length) return { groups: N, decided: true };
  return { groups: list, decided: false };
}

/* ---- live matching: find suburbs inside raw OCR text ---- */
const CANDS = KEYS.map(k => ({ key: k, toks: k.split(' '), len: k.replace(/ /g, '').length }))
  .concat(ALLAREAS.map(([base]) => ({ key: base, toks: base.split(' '), len: base.replace(/ /g, '').length, area: true })));
function tokEq(a, b) {
  if (a === b) return 2;
  const L = Math.max(a.length, b.length);
  if (L < 6) return 0;
  const mx = L >= 9 ? 2 : 1;
  return lev(a, b, mx) <= mx ? 1 : 0;
}
function findMatches(text) {
  const t = norm(text).split(' ').filter(Boolean);
  const anchorAt = j => j < t.length && (t[j] === 'SA' || /^5\d{3}$/.test(t[j]));
  const found = [];
  for (let i = 0; i < t.length; i++) {
    for (const c of CANDS) {
      const m = c.toks.length;
      if (i + m > t.length) continue;
      let ex = true, ok = true;
      for (let k = 0; k < m; k++) {
        const r = tokEq(c.toks[k], t[i + k]);
        if (!r) { ok = false; break; }
        if (r === 1) ex = false;
      }
      if (!ok) continue;
      let anch = anchorAt(i + m);
      if (!anch && c.area) anch = anchorAt(i + m + 1) || anchorAt(i + m + 2);
      if (!anch && !(ex && c.len >= 8)) continue;
      found.push({ c, i, end: i + m, anch, ex, score: (anch ? 1000 : 0) + m * 100 + c.len + (ex ? 10 : 0) });
    }
  }
  found.sort((a, b) => b.score - a.score);
  const out = [];
  for (const f of found) {
    if (out.some(u => f.i < u.end && u.i < f.end)) continue;
    out.push(f);
  }
  out.sort((a, b) => (b.anch - a.anch) || (a.i - b.i));
  return out.slice(0, 2).map(f => {
    let pc = '';
    for (let j = f.end; j < Math.min(t.length, f.end + 4); j++) if (/^5\d{3}$/.test(t[j])) { pc = t[j]; break; }
    return { query: f.c.key, anch: f.anch, ex: f.ex, postcode: pc, street: t.slice(Math.max(0, f.i - 8), f.i).join(' ') };
  });
}

    if (groups.length === 1 || decided) {
      kids.push(h('div', { class: 'nums' + (big ? ' single' : '') }, all.map(n => h('span', { class: 'num' + (isMine(n) ? ' yours' : ''), text: n }))));
      if (mine.length && big) kids.push(hit.length ? h('div', { class: 'verdict yours', text: 'Yours · take it' }) : h('div', { class: 'verdict pass', text: 'Write ' + all.join(', ') + ' · let it go' }));
    } else {
      kids.push(h('p', { class: 'meta', text: 'Your sheet splits this suburb by street. Check the street on the label.' }));
      kids.push(h('div', { class: 'variants' }, groups.map(e => h('div', { class: 'variant' },
        h('div', { class: 'vl', text: e.st ? (/^ex\b/i.test(e.st) ? 'Not ' + e.st.replace(/^ex\s+/i, '') : e.st) : 'No street noted' }),
        h('div', { class: 'nums mid' }, e.nums.map(n => h('span', { class: 'num' + (isMine(n) ? ' yours' : ''), text: n })))))));
    }
    const warn = [];
    if (res.how === 'near') warn.push('Closest match on your sheet. Check the label.');
    if (m.unconfirmed) warn.push('SA or postcode not read. Check the label.');
    if (groups.some(e => e.chk)) warn.push('This sheet row was hard to read. Check the paper sheet.');
    if (warn.length) kids.push(h('p', { class: 'warnbox', text: warn.join(' ') }));
    return h('div', { class: 'lab' }, kids);
  }
  let shown = null; // {items:[...], at:ms}
  const box = $('result');
  function idle() {
    box.replaceChildren(h('div', { class: 'idle' }, h('div', { class: 'big', text: 'Point at the address' }),
      h('p', { class: 'meta', text: 'Tap Start camera. Keep the delivery address flat and in the frame. The number shows here and stays until the next label.' })));
  }
  function redraw() {
    if (!shown) return;
    const [a, b] = shown.items;
    const age = Math.round((Date.now() - shown.at) / 1000);
    box.replaceChildren(...[
      labelEl(a, true),
      b ? h('div', { class: 'also' }, h('div', { class: 'label', text: 'Also on this label' }), labelEl(b, false)) : null,
      h('p', { class: 'meta', id: 'age', text: age < 3 ? 'Just now' : age + ' s ago' })].filter(Boolean));
  }
  setInterval(() => { const a = $('age'); if (a && shown) { const s = Math.round((Date.now() - shown.at) / 1000); a.textContent = s < 3 ? 'Just now' : s + ' s ago'; } }, 1000);
  function show(items) {
    const key = items.map(i => i.query).join('|');
    if (shown && shown.key === key) { shown.at = Date.now(); return; }
    shown = { items, key, at: Date.now() };
    redraw();
    addRecent(items[0]);
  }
  function addRecent(m) {
    recent = recent.filter(r => r.query !== m.query || r.street !== m.street);
    recent.unshift({ query: m.query, street: m.street || '', postcode: m.postcode || '' });
    recent = recent.slice(0, 8);
    store.set('belt.recent', recent);
    renderRecent();
  }
  function renderRecent() {
    $('recent-wrap').hidden = recent.length === 0;
    $('recent').replaceChildren(...recent.map(r => {
      const res = lookup(r.query);
      if (!res.list.length) return null;
      const { groups } = resolveLive(res.list, r.street);
      const all = [];
      groups.forEach(e => e.nums.forEach(n => { if (!all.includes(n)) all.push(n); }));
      return h('li', null, h('button', { type: 'button', onclick: () => { shown = { items: [r], key: r.query, at: Date.now() }; redraw(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
        h('span', null, title(res.list[0].name)), h('span', { class: 'nn' }, all.map(n => h('span', { class: 'mini' + (isMine(n) ? ' yours' : ''), text: n })))));
    }).filter(Boolean));
  }

  /* ---------- typed lookup ---------- */
  const q = $('q'), sb = $('sugg');
  const numsText = key => { const o = []; IDX.get(key).forEach(e => e.nums.forEach(n => { if (!o.includes(n)) o.push(n); })); return o.join(' · '); };
  q.addEventListener('input', () => {
    sb.replaceChildren(...search(q.value).map(k => h('li', null, h('button', { type: 'button', onclick: () => pick(k) }, h('span', { text: title(IDX.get(k)[0].name) }), h('span', { class: 'n', text: numsText(k) })))));
  });
  q.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); const k = search(q.value)[0]; if (k) pick(k); } });
  function pick(k) { q.value = ''; sb.replaceChildren(); show([{ query: k, anch: true, ex: true, street: '', postcode: '' }]); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  /* ---------- camera + reader ---------- */
  const vid = $('vid'), stat = $('camstat'), btn = $('go'), btnTxt = $('go-txt');
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const sm = document.createElement('canvas'), sx = sm.getContext('2d', { willReadFrequently: true });
  let stream = null, worker = null, running = false, wake = null, hist = [];

  function setStat(t) { stat.textContent = t; }
  async function getWorker() {
    if (worker) return worker;
    if (!window.Tesseract) throw { code: 'lib' };
    setStat('Loading the reader. First time takes a little while.');
    const w = await Tesseract.createWorker('eng');
    await w.setParameters({
      tessedit_pageseg_mode: '11',
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ,.-/\''
    });
    worker = w;
    return w;
  }
  function sharpness(ctx, w, hh) {
    const d = ctx.getImageData(0, 0, w, hh).data, g = new Float32Array(w * hh);
    for (let i = 0; i < w * hh; i++) g[i] = d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11;
    let s = 0, s2 = 0, n = 0;
    for (let y = 1; y < hh - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w]; s += l; s2 += l * l; n++; }
    return s2 / n - (s / n) * (s / n);
  }
  function prep() {
    const vw = vid.videoWidth, vh = vid.videoHeight;
    const k = Math.min(1, 1200 / Math.max(vw, vh));
    cv.width = Math.round(vw * k); cv.height = Math.round(vh * k);
    cx.drawImage(vid, 0, 0, cv.width, cv.height);
    const im = cx.getImageData(0, 0, cv.width, cv.height), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      let g = d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
      g = (g - 128) * 1.4 + 128; g = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    cx.putImageData(im, 0, 0);
  }
  function accept(ms) {
    hist.push(ms.map(m => m.query)); hist = hist.slice(-3);
    const seen = qy => hist.filter(x => x.includes(qy)).length;
    const good = ms.filter(m => (m.anch && m.ex) || (m.anch && seen(m.query) >= 2));
    if (good.length) { show(good.slice(0, 2)); return; }
    const unc = ms.filter(m => !m.anch && seen(m.query) >= 3);
    if (unc.length && !ms.some(m => m.anch)) show([Object.assign({}, unc[0], { unconfirmed: true })]);
  }
  async function loop() {
    let best = 0, looks = 0, t0 = performance.now();
    while (running) {
      if (vid.readyState < 2 || !vid.videoWidth) { await sleep(100); continue; }
      const sw = 200, sh = Math.max(1, Math.round(sw * vid.videoHeight / vid.videoWidth));
      sm.width = sw; sm.height = sh; sx.drawImage(vid, 0, 0, sw, sh);
      const s = sharpness(sx, sw, sh);
      best = Math.max(best * 0.97, s);
      if (s < best * 0.35) { setStat('Too blurry. Hold steady.'); await sleep(80); continue; }
      prep();
      setStat('Reading…');
      let text = '';
      try { text = (await worker.recognize(cv)).data.text || ''; } catch (e) { if (!running) break; setStat('Reader error. Tap Stop, then Start camera.'); await sleep(500); continue; }
      if (!running) break;
      looks++;
      const ms = findMatches(text);
      if (ms.length) accept(ms); else { hist.push([]); hist = hist.slice(-3); }
      const per = ((performance.now() - t0) / looks / 1000).toFixed(1);
      setStat(ms.length ? 'Reading… (' + per + ' s per look)' : 'Looking for an address… (' + per + ' s per look)');
      await sleep(30);
    }
  }
  async function start() {
    btn.disabled = true; btnTxt.textContent = 'Starting…';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { code: 'nomedia' };
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      vid.srcObject = stream;
      await vid.play();
      $('cam').classList.add('on');
      await getWorker();
      try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
      running = true; hist = [];
      btn.disabled = false; btnTxt.textContent = 'Stop camera'; btn.classList.add('stop');
      loop();
    } catch (e) {
      stopCam();
      const n = e && (e.name || e.code);
      setStat(n === 'NotAllowedError' ? 'Camera is blocked. In Safari tap aA, then Website Settings, then allow Camera.'
        : n === 'nomedia' ? 'This page needs https to use the camera.'
        : n === 'lib' ? 'The reader did not load. Check your internet and reload.'
        : 'Could not start. ' + ((e && e.message) || 'Reload and try again.'));
    }
  }
  function stopCam() {
    running = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; vid.srcObject = null;
    if (wake) { try { wake.release(); } catch (e) { /* ignore */ } wake = null; }
    $('cam').classList.remove('on');
    btn.disabled = false; btn.classList.remove('stop'); btnTxt.textContent = 'Start camera';
  }
  btn.addEventListener('click', () => { if (running) { stopCam(); setStat('Camera off.'); } else start(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) { stopCam(); setStat('Camera stopped when you left the page.'); } });

  renderMine(); renderRecent(); idle();
})();

</script>
</body>
</html>
